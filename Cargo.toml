[package]
name = "actor-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
async-executor = "1.14.0"
#NOTE: this has a tracing feature, which i assume just adds logs, which i don't want
async-io = { version = "2.6.0", default-features = false }
async-process = "2.5.0"
async-watch = "0.3.1"
#NOTE: this has a tracing feature, which i assume just adds logs, which i don't want
blocking = { version = "1.6.2", default-features = false }
futures-core = "0.3.32"
#NOTE: this includes so many various things i don't use, so i only include the features i
#actually use
futures-util = { version = "0.3.32", default-features = false, features = ["std", "io"] }
#NOTE: this one has no default features, so i have to activate these here
oneshot = { version = "0.2.1", features = ["async", "std"] }
pin-project = "1.1.13"
signal-hook = "0.4.4"
snafu = "0.9.0"
static_assertions = "1.1.0"
tracing = "0.1.44"
tracing-error = "0.2.1"

[dev-dependencies]
anstream = "1.0.0"
ctor = "1.0.9"
futures-test = "0.3.32"
tracing-subscriber = "0.3.23"

# [patch.crates-io]
#RANT: I dont like this crate: it has bugs like polling depleted streams more than once,
#it is missing things that should be there, like Fuse not implementing FusedStream. Even
#though i like the simplified API over futures, i will not use it since its so buggy. For
#example, the StreamExt::race never terminates.
# futures-lite = {path="../futures-lite"}

[lints.rust]
#NOTE: this is nice because it removes ambiguity whether something that is pub is public
#api of the crate as a whole or just pub of the current module. This adds a lot of extra
#text to write, but it's probably worth it in this case to make sure nothing is exposed
#accidentally.
#TODO: enable this as fix everywhere
# unreachable_pub = "warn"
#NOTE: this is important for a library, it's annoying to interact with a type that can't
#be named
unnameable_types = "warn"
#TODO: should i also use the missing_debug_implementations?

[lints.clippy]
#NOTE: I want all of them documented, all usages of unsafe must explain themselves
undocumented_unsafe_blocks = "warn"
